<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search and compare recent evidence on India's E20 ethanol blending debate.">
  <title>E20 Evidence Desk</title>
  <style>
    :root{--ink:#21172b;--muted:#6f6479;--paper:#f6f2f8;--panel:#fcfaff;--line:#d9cfe0;--purple:#55326f;--deep:#39204e;--lavender:#d9baf1;--green:#247a45;--red:#b23a35;--gray:#706b74;--blue:#326aa3}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}a{color:inherit}
    header{padding:19px clamp(22px,5vw,72px);background:var(--deep);color:#fff;display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--lavender);color:var(--deep);font-size:12px;font-weight:800}.brand{font-weight:800}
    .hero{padding:50px clamp(22px,8vw,120px);background:var(--purple);color:#fff}.hero small{color:var(--lavender);text-transform:uppercase;letter-spacing:.16em;font-weight:800}.hero h1{max-width:900px;margin:16px 0;font:400 clamp(42px,6vw,76px)/1 Georgia,serif;letter-spacing:-.045em}.hero p{max-width:680px;color:#eadff0;line-height:1.55}
    main{max-width:1450px;margin:auto;padding:42px clamp(20px,5vw,72px) 80px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:18px;border:1px solid var(--line);background:var(--panel)}label{display:grid;gap:7px;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}input,select{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:0}input:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 2px #55326f22}
    .reasoning{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}.reasoning button{padding:9px 12px;border:2px solid var(--line);background:#fff;cursor:pointer;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.reasoning button[data-kind=supports],.reasoning button[data-kind=corroborates]{border-color:var(--green);color:var(--green)}.reasoning button[data-kind=challenges]{border-color:var(--red);color:var(--red)}.reasoning button[data-kind=neutral]{border-color:var(--gray);color:var(--gray)}.reasoning button[data-kind=primary]{border-color:var(--blue);color:var(--blue)}.reasoning button[data-kind=explains]{border-color:var(--purple);color:var(--purple)}.reasoning button.active{background:var(--purple);color:#fff}.reasoning button[data-kind=supports].active,.reasoning button[data-kind=corroborates].active{background:var(--green)}.reasoning button[data-kind=challenges].active{background:var(--red)}.reasoning button[data-kind=neutral].active{background:var(--gray)}.reasoning button[data-kind=primary].active{background:var(--blue)}.reasoning button[data-kind=explains].active{background:var(--purple)}
    .result-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:28px 0 16px}.result-head h2{margin:0;font:400 34px Georgia,serif}.result-head span{color:var(--muted);font-size:11px}.list{display:grid;gap:14px}.story{padding:23px 24px;border:2px solid var(--gray);border-left-width:8px;background:#f8f7f9;box-shadow:0 4px 12px #3d274912}.story.supports{border-color:var(--green);background:#f4faf5}.story.challenges{border-color:var(--red);background:#fdf6f5}.meta{display:flex;flex-wrap:wrap;gap:9px;color:var(--muted);font-size:10px}.publisher{color:var(--purple);font-weight:800}.story h3{margin:10px 0 8px;font:400 clamp(20px,2vw,28px)/1.2 Georgia,serif}.story h3 a{text-decoration:none}.story h3 a:hover{color:var(--purple);text-decoration:underline}.summary{max-width:950px;margin:0;color:var(--muted);font-size:12px;line-height:1.55}.cues{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.cue{padding:6px 9px;border:1px solid;border-radius:20px;background:#fff;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.cue.supports,.cue.corroborates{color:var(--green)}.cue.challenges{color:var(--red)}.cue.neutral{color:var(--gray)}.cue.primary{color:var(--blue)}.cue.explains{color:var(--purple)}.footer{display:flex;justify-content:space-between;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid #00000012;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.footer a{color:var(--purple);font-weight:800;text-decoration:none}.empty{padding:50px;border:1px solid var(--line);background:#fff;text-align:center;color:var(--muted)}.load{width:100%;margin-top:18px;padding:14px;border:1px solid var(--purple);background:transparent;color:var(--purple);font-weight:800;cursor:pointer}.load:hover{background:var(--purple);color:#fff}
    @media(max-width:760px){.filters{grid-template-columns:1fr}.hero{padding-top:38px;padding-bottom:42px}.hero h1{font-size:44px}.story{padding:20px 16px}.result-head{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
  <header><span class="mark">E20</span><span class="brand">Evidence Desk</span></header>
  <section class="hero">
    <small>India · Ethanol blending</small>
    <h1>Follow the evidence behind India’s E20 debate.</h1>
    <p>Search and compare recent reporting, public records, and specialist analysis from reviewed sources without flattening their differences.</p>
  </section>
  <main>
    <section aria-label="Evidence filters">
      <div class="filters">
        <label>Search evidence<input id="search" type="search" placeholder="Search headlines, summaries, or publishers"></label>
        <label>Topic<select id="topic"><option value="all">All topics</option><option value="consumer">Consumer impact</option><option value="core">E20 rollout</option><option value="environment_agriculture">Environment and agriculture</option><option value="industry">Industry</option><option value="policy_legal">Policy and legal</option></select></label>
        <label>Publisher<select id="publisher"><option value="all">All publishers</option></select></label>
      </div>
      <div class="reasoning" aria-label="Reasoning relationship filters">
        <button data-kind="all" class="active"><span>All reasoning</span></button>
        <button data-kind="supports"><span>＋ Supports</span></button>
        <button data-kind="challenges"><span>− Challenges</span></button>
        <button data-kind="neutral"><span>↔ Mixed or neutral</span></button>
        <button data-kind="primary"><span>▤ Primary record</span></button>
        <button data-kind="corroborates"><span>◎ Corroborates</span></button>
        <button data-kind="explains"><span>◇ Context</span></button>
      </div>
    </section>
    <div class="result-head"><h2>Evidence library</h2><span id="count">Loading evidence…</span></div>
    <section id="list" class="list" aria-live="polite"></section>
    <button id="load" class="load" hidden>Load more</button>
  </main>
  <script>
    const familyLabel={consumer:"Consumer impact",core:"E20 rollout",environment_agriculture:"Environment and agriculture",industry:"Industry",policy_legal:"Policy and legal"};
    const positionMeta={supports:["＋","Supports"],challenges:["−","Challenges"],neutral:["↔","Mixed or neutral"]};
    const functionMeta={primary:["▤","Primary record"],corroborates:["◎","Corroborates"],explains:["◇","Context"]};
    const state={items:[],query:"",topic:"all",publisher:"all",reasoning:"all",visible:24};
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const clean=value=>String(value??"").replace(/[—–]/g,",");
    function position(item){const text=`${item.headline} ${item.summary}`.toLowerCase();if(/\b(no impact|safe|benefit|boost|saving|ready|myth|clarif|defend|unstoppable|success|advantage)\b/.test(text))return"supports";if(/\b(concern|complain|damage|drop|reduce|risk|against|protest|challenge|problem|worr|rushed|water|food security|no assessment|critici|backlash|petition)\b/.test(text))return"challenges";return"neutral"}
    function evidenceFunction(item){const text=`${item.headline} ${item.summary}`.toLowerCase();if(item.source_class==="government"||/\b(supreme court|rajya sabha|lok sabha|parliament|government says|centre says|official|ministry|factsheet)\b/.test(text))return"primary";if(/\b(study|survey|data|report|finds|according to|analysis|test|research|assessment|figures)\b/.test(text))return"corroborates";return"explains"}
    function prettyDate(value){return new Intl.DateTimeFormat("en-IN",{day:"numeric",month:"short",year:"numeric"}).format(new Date(value))}
    function filtered(){const q=state.query.toLowerCase();return state.items.filter(item=>{const p=position(item),f=evidenceFunction(item);return(!q||`${item.headline} ${item.summary} ${item.publisher}`.toLowerCase().includes(q))&&(state.topic==="all"||item.query_family===state.topic)&&(state.publisher==="all"||item.publisher===state.publisher)&&(state.reasoning==="all"||p===state.reasoning||f===state.reasoning)})}
    function render(){const items=filtered();document.getElementById("count").textContent=`${items.length} evidence items · newest first`;const visible=items.slice(0,state.visible);document.getElementById("list").innerHTML=visible.length?visible.map(item=>{const p=position(item),f=evidenceFunction(item);return`<article class="story ${p}"><div class="meta"><span class="publisher">${esc(item.publisher)}</span><span>·</span><time>${prettyDate(item.published_at)}</time><span>·</span><span>${esc(item.source_class.replaceAll("_"," "))}</span></div><h3><a href="${esc(item.url)}" target="_blank" rel="noreferrer">${esc(clean(item.headline))}</a></h3><p class="summary">${esc(clean(item.summary||item.story_text?.slice(0,240)||"Publisher metadata record."))}</p><div class="cues"><span class="cue ${p}">${positionMeta[p][0]} ${positionMeta[p][1]}</span><span class="cue ${f}">${functionMeta[f][0]} ${functionMeta[f][1]}</span></div><div class="footer"><span>${esc(familyLabel[item.query_family]||item.query_family)}</span><a href="${esc(item.url)}" target="_blank" rel="noreferrer">Read source ↗</a></div></article>`}).join(""):`<div class="empty">No evidence matches these filters.</div>`;const load=document.getElementById("load");load.hidden=items.length<=state.visible;load.textContent=`Load more (${items.length-state.visible} remaining)`}
    fetch("items.json").then(response=>response.json()).then(items=>{state.items=items.sort((a,b)=>b.published_at.localeCompare(a.published_at));const publishers=[...new Set(items.map(item=>item.publisher))].sort();document.getElementById("publisher").insertAdjacentHTML("beforeend",publishers.map(p=>`<option>${esc(p)}</option>`).join(""));render()}).catch(()=>{document.getElementById("count").textContent="Evidence could not be loaded";document.getElementById("list").innerHTML='<div class="empty">Open this folder through a web server or upload both files together to a static host.</div>'});
    document.getElementById("search").addEventListener("input",event=>{state.query=event.target.value;state.visible=24;render()});document.getElementById("topic").addEventListener("change",event=>{state.topic=event.target.value;state.visible=24;render()});document.getElementById("publisher").addEventListener("change",event=>{state.publisher=event.target.value;state.visible=24;render()});document.querySelectorAll(".reasoning button").forEach(button=>button.addEventListener("click",()=>{state.reasoning=button.dataset.kind;state.visible=24;document.querySelectorAll(".reasoning button").forEach(candidate=>candidate.classList.toggle("active",candidate===button));render()}));document.getElementById("load").addEventListener("click",()=>{state.visible+=24;render()});
  </script>
</body>
</html>
